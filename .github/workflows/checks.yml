name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm test
      - run: npm run build:preview
      - run: npm run test:build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser regression
        run: |
          npm run preview > /tmp/wind-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          preview_ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4173/tools > /dev/null; then
              preview_ready=1
              break
            fi
            sleep 1
          done
          if [ "$preview_ready" -ne 1 ]; then
            cat /tmp/wind-preview.log
            echo "Preview server did not become ready within 30 seconds."
            exit 1
          fi
          npm run test:browser
          npm run test:diff
          npm run test:code-image
          npm run test:canvas-workbench
          npm run test:compat
          npm run test:sidebar
          npm run test:i18n
        env:
          PW_CHANNEL: bundled
          I18N_WORKER_DELAY_MS: 250
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-artifacts
          path: artifacts/
